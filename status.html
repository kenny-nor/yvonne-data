<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yvonne Data Status</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0f0f12;--card:#1a1a20;--ink:#f3eee5;--muted:#b4ada0;--gold:#f1cd82;--ok:#7fd18b;--warn:#ffb86b}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#faf7f2;--card:#fff;--ink:#1d1a16;--muted:#6b645a;--gold:#9a7531;--ok:#2f7d3a;--warn:#a85a00}}
:root[data-theme="light"]{--bg:#faf7f2;--card:#fff;--ink:#1d1a16;--muted:#6b645a;--gold:#9a7531;--ok:#2f7d3a;--warn:#a85a00}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#1a1a20;--ink:#f3eee5;--muted:#b4ada0;--gold:#f1cd82;--ok:#7fd18b;--warn:#ffb86b}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Arial;padding:24px 16px}
main{max-width:560px;margin:auto}h1{font:700 24px Georgia,serif;color:var(--gold);margin:0 0 4px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-top:16px;border:1px solid rgba(160,130,70,.35)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(160,130,70,.15)}
.row:last-child{border:0}.k{color:var(--muted)}.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}
code{font-size:13px;word-break:break-all}
</style></head><body><main>
<h1>⚡ Yvonne's Lightning Strikes</h1><div class="k">Automatic data updates</div>
<div class="card" id="box">Loading status…</div>
<div class="card"><div class="k">Data link for the app</div><code id="url"></code></div>
</main>
<script>
const base=location.href.replace(/[^/]*$/,'');document.getElementById('url').textContent=base+'data/snapshot.json';
fetch('data/status.json',{cache:'no-store'}).then(r=>r.json()).then(s=>{
  const hrs=(Date.now()-Date.parse(s.builtAt))/36e5,fresh=hrs<30;
  const row=(k,v,c)=>'<div class="row"><span class="k">'+k+'</span><span'+(c?' class="'+c+'"':'')+'>'+v+'</span></div>';
  document.getElementById('box').innerHTML=
    row('Status',fresh?'Up to date':'Not updated in '+Math.round(hrs)+' hours',fresh?'ok':'warn')+
    row('Last updated',new Date(s.builtAt).toLocaleString())+
    row('Results through','Week '+s.throughWeek)+
    row('Next week','Week '+s.targetWeek)+
    row('Injury report for Week '+s.targetWeek,s.injuryReportRows?s.injuryReportRows+' players listed':'Not posted yet',s.injuryReportRows?'ok':'warn')+
    row('Depth charts',s.depthTeams+' of 32 teams',s.depthTeams===32?'ok':'warn');
}).catch(()=>{document.getElementById('box').textContent='No data published yet.'});
</script></body></html>
